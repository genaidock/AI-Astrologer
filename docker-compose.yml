version: '3.8'

services:
  ai-astrologer:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ai-astrologer
    restart: unless-stopped
    # Enables communication with Ollama running on the Oracle host machine
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      # Port & Host
      - PORT=8000
      - HOST=0.0.0.0
      # LLM Connection to Host Ollama
      - LLM_API_BASE=http://host.docker.internal:11434/v1
      - LLM_MODEL=qwen3.6-35b
      - LLM_API_KEY=ollama
      - LLM_THINK=false
      - LLM_TIMEOUT=300
      # Web / CORS
      - CORS_ORIGINS=*
    ports:
      - "8000:8000"
    volumes:
      # Persist Geonames city coordinates cache across restarts
      - astrologer-cache:/app/cache
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

volumes:
  astrologer-cache:
    driver: local
