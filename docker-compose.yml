version: '3.8'

services:
  ai-astrologer:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ai-astrologer
    restart: unless-stopped
    # extra_hosts not needed for OmniRoute (accessible via public IP on same server)
    # Uncomment below if switching back to host Ollama:
    # extra_hosts:
    #   - "host.docker.internal:host-gateway"
    environment:
      # Port & Host
      - PORT=8000
      - HOST=0.0.0.0
      # LLM via OmniRoute (running on same Oracle server, port 20128)
      # OmniRoute is an OpenAI-compatible gateway that routes to 350+ AI providers.
      - LLM_API_BASE=http://130.210.19.223:20128/v1
      - LLM_API_KEY=sk-9fff06bc81bb97f3-58de2b-9d94a3e2
      - LLM_MODEL=auto
      - LLM_THINK=false
      - LLM_TIMEOUT=120
      # Web / CORS
      - CORS_ORIGINS=*
    ports:
      - "8000:8000"
    volumes:
      # Persist Geonames city coordinates cache across restarts
      - astrologer-cache:/app/cache
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

volumes:
  astrologer-cache:
    driver: local
